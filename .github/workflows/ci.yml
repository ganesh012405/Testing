name: Test and Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ffmpeg
        run: npx playwright install ffmpeg

      - name: Install Chromium browser
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            playwright-report/
            test-report/
            test-results/
          retention-days: 14

  build:
    name: Build Dashboard
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package dashboard
        run: |
          mkdir -p dist
          cp -r dashboard dist/
          cp README.md dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleetpulse-dashboard
          path: dist/
          retention-days: 14
